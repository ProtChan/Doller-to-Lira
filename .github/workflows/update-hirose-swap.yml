name: Update Hirose USDTRY swap

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hirose-swap-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch latest Hirose swap
        run: python3 scripts/update-hirose-swap.py
      - name: Commit feed when changed
        run: |
          if git diff --quiet -- data/hirose-usdtry-swap.json; then
            echo 'No feed change'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/hirose-usdtry-swap.json
          git commit -m 'Update Hirose USDTRY swap feed'
          git push
