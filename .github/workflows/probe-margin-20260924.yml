name: Probe Hirose margins 20260924
on:
  push:
    branches: [margin-probe-20260924]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe official PDFs
        run: |
          python3 -m pip install --quiet pypdf
          python3 - <<'PY'
          import io, re, urllib.request
          from pypdf import PdfReader
          dates = ['2026-09-18','2026-09-21','2026-09-22','2026-09-23','2026-09-24']
          for date in dates:
              ymd = date.replace('-','')
              url = f'https://hirose-fx.jp/pdf/deposit/{ymd}/lionfx.pdf'
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      raw = r.read()
                  text = '\n'.join((p.extract_text() or '') for p in PdfReader(io.BytesIO(raw)).pages)
                  flat = re.sub(r'[ \t]+', ' ', text)
                  m = re.search(r'USD/TRY\s+1,000(?:通貨)?\s+([0-9,]+)\s*円', flat, re.S)
                  if not m:
                      i = flat.find('USD/TRY')
                      print('NO_MATCH', date, repr(flat[max(0,i-80):i+180] if i >= 0 else flat[:300]))
                  else:
                      print('MARGIN', date, int(m.group(1).replace(',','')), url)
              except Exception as e:
                  print('ERROR', date, type(e).__name__, str(e))
          PY
