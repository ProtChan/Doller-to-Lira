name: Deploy ドルとリラ to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check patch-hirose-pending-20260907.js
          node --check patch-hirose-pending-bootstrap-20260907.js
          node --check patch-hirose-rate-history-20260907.js
          node --check scripts/e2e-hirose-rates.mjs
      - name: Runtime smoke test
        run: node smoke-runtime.js
      - name: Install browser test runtimes
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Real Chromium DOM interaction test (local build)
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/dtl-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          BROWSER=chromium node scripts/e2e.mjs
          BROWSER=chromium node scripts/e2e-hirose-pending.mjs
          BROWSER=chromium node scripts/e2e-hirose-rates.mjs
      - name: Real WebKit DOM interaction test (local build)
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/dtl-http-webkit.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          BROWSER=webkit node scripts/e2e.mjs
          BROWSER=webkit node scripts/e2e-hirose-pending.mjs
          BROWSER=webkit node scripts/e2e-hirose-rates.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Real Chromium DOM interaction test (deployed Pages)
        env:
          TEST_URL: ${{ steps.deployment.outputs.page_url }}
          BROWSER: chromium
        run: |
          node scripts/e2e.mjs
          node scripts/e2e-hirose-pending.mjs
          node scripts/e2e-hirose-rates.mjs
      - name: Real WebKit DOM interaction test (deployed Pages)
        env:
          TEST_URL: ${{ steps.deployment.outputs.page_url }}
          BROWSER: webkit
        run: |
          node scripts/e2e.mjs
          node scripts/e2e-hirose-pending.mjs
          node scripts/e2e-hirose-rates.mjs
