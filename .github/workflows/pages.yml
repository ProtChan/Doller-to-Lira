name: Deploy ドルとリラ to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe Hirose official USDTRY margins
        run: |
          python3 -m pip install --quiet pypdf
          python3 - <<'PY'
          import io, json, re, urllib.request
          from pypdf import PdfReader
          from pathlib import Path

          data = json.loads(Path('data/hirose-usdtry-margin.json').read_text())
          dates = [row['date'] for row in data.get('history', [])]
          out = {}
          for date in dates:
              ymd = date.replace('-', '')
              url = f'https://hirose-fx.jp/pdf/deposit/{ymd}/lionfx.pdf'
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      raw = r.read()
                  text = '\n'.join((p.extract_text() or '') for p in PdfReader(io.BytesIO(raw)).pages)
                  flat = re.sub(r'[ \\t]+', ' ', text)
                  m = re.search(r'USD/TRY\\s+1,000(?:通貨)?\\s+([0-9,]+)\\s*円', flat, re.S)
                  if not m:
                      i = flat.find('USD/TRY')
                      print('NO_MATCH', date, repr(flat[max(0,i-80):i+180] if i >= 0 else flat[:300]))
                      continue
                  out[date] = int(m.group(1).replace(',', ''))
                  print('MARGIN', date, out[date])
              except Exception as e:
                  print('ERROR', date, type(e).__name__, str(e))
          print('MARGIN_JSON=' + json.dumps(out, ensure_ascii=False, sort_keys=True))
          PY

      - name: Validate source and publisher logic
        run: |
          set -euo pipefail
          for file in app.js patch-*.js runtime-*.js scripts/e2e*.mjs scripts/test-*.mjs scripts/build-app.mjs scripts/runtime-manifest.mjs; do
            node --check "$file"
          done
          node scripts/test-fixture-policy.mjs
          python3 -m py_compile scripts/publish_hirose_rate.py scripts/test_publish_hirose_rate.py scripts/update-hirose-swap.py
          PYTHONPATH=scripts python3 scripts/test_publish_hirose_rate.py

      - name: Build canonical production backend
        run: |
          node scripts/build-app.mjs
          node --check dist/app.bundle.js
          node scripts/test-backend-architecture.mjs

      - name: Runtime smoke test
        run: node smoke-runtime.js

      - name: Install browser test runtimes
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      # Full regression suite once in Chromium. This is the broad functional gate.
      - name: Full Chromium regression (local production build)
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/dtl-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for test in \
            scripts/e2e.mjs \
            scripts/e2e-live-rate-refresh.mjs \
            scripts/e2e-close-conversion.mjs \
            scripts/e2e-capital-history.mjs \
            scripts/e2e-hirose-weekend.mjs \
            scripts/e2e-pnl-date-alignment.mjs \
            scripts/e2e-rate-edit-performance.mjs \
            scripts/e2e-publisher-risk.mjs \
            scripts/e2e-layout.mjs; do
            BROWSER=chromium node "$test"
          done

      # WebKit runs only browser-sensitive interaction/PWA/rendering paths. Pure
      # accounting invariants are already exercised by the full Chromium gate.
      - name: WebKit browser-sensitive regression (local production build)
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/dtl-http-webkit.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for test in \
            scripts/e2e.mjs \
            scripts/e2e-live-rate-refresh.mjs \
            scripts/e2e-close-conversion.mjs \
            scripts/e2e-pnl-date-alignment.mjs \
            scripts/e2e-rate-edit-performance.mjs \
            scripts/e2e-publisher-risk.mjs \
            scripts/e2e-layout.mjs; do
            BROWSER=webkit node "$test"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Deployed checks verify hosting/cache/network integration rather than repeating
      # every local accounting test a second time.
      - name: Chromium deployed smoke/regression
        env:
          TEST_URL: ${{ steps.deployment.outputs.page_url }}
          BROWSER: chromium
        run: |
          for test in \
            scripts/e2e.mjs \
            scripts/e2e-live-rate-refresh.mjs \
            scripts/e2e-pnl-date-alignment.mjs \
            scripts/e2e-publisher-risk.mjs \
            scripts/e2e-layout.mjs; do
            node "$test"
          done

      - name: WebKit deployed smoke/regression
        env:
          TEST_URL: ${{ steps.deployment.outputs.page_url }}
          BROWSER: webkit
        run: |
          for test in \
            scripts/e2e.mjs \
            scripts/e2e-live-rate-refresh.mjs \
            scripts/e2e-pnl-date-alignment.mjs \
            scripts/e2e-layout.mjs; do
            node "$test"
          done
