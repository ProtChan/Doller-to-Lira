name: Publish Hirose ASK rate

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: hirose-rate-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[HIROSE-RATE]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and update feed
        run: python3 scripts/publish_hirose_rate.py --event "$GITHUB_EVENT_PATH"

      - name: Commit publication
        id: commit
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if git diff --quiet -- data/hirose-ask-close-23.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hirose-ask-close-23.json
          git commit -m "Publish Hirose ASK rate from issue #${ISSUE_NUMBER}"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "push failed after 3 attempts" >&2
              exit 1
            fi
            git pull --rebase origin main
          done

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Confirm publication
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CHANGED: ${{ steps.commit.outputs.changed }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            BODY="配信データを更新しました。commit: ${SHA}. GitHub Pages はこの push から自動再配信されます。"
          else
            BODY="同じ値がすでに配信済みだったため、データ変更はありませんでした。"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
