name: Deploy ドルとリラ to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source and publisher logic
        run: |
          set -euo pipefail
          for file in app.js patch-*.js runtime-*.js scripts/e2e*.mjs scripts/test-*.mjs scripts/build-app.mjs scripts/runtime-manifest.mjs; do
            node --check "$file"
          done
          node scripts/test-fixture-policy.mjs
          python3 -m py_compile scripts/publish_hirose_rate.py scripts/test_publish_hirose_rate.py scripts/update-hirose-swap.py
          PYTHONPATH=scripts python3 scripts/test_publish_hirose_rate.py

      - name: Build canonical production backend
        run: |
          node scripts/build-app.mjs
          node --check dist/app.bundle.js
          node scripts/test-backend-architecture.mjs

      - name: Runtime smoke test
        run: node smoke-runtime.js

      - name: Install browser test runtimes
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Real Chromium DOM interaction test (local production build)
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/dtl-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for test in \
            scripts/e2e.mjs \
            scripts/e2e-hirose-pending.mjs \
            scripts/e2e-hirose-rates.mjs \
            scripts/e2e-live-rate-refresh.mjs \
            scripts/e2e-close-conversion.mjs \
            scripts/e2e-capital-history.mjs \
            scripts/e2e-hirose-weekend.mjs \
            scripts/e2e-pnl-date-alignment.mjs \
            scripts/e2e-same-day-valuation.mjs \
            scripts/e2e-rate-edit-performance.mjs \
            scripts/e2e-publisher-risk.mjs \
            scripts/e2e-reference-rebuild.mjs \
            scripts/e2e-layout.mjs; do
            BROWSER=chromium node "$test"
          done

      - name: Real WebKit DOM interaction test (local production build)
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/dtl-http-webkit.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for test in \
            scripts/e2e.mjs \
            scripts/e2e-hirose-pending.mjs \
            scripts/e2e-hirose-rates.mjs \
            scripts/e2e-live-rate-refresh.mjs \
            scripts/e2e-close-conversion.mjs \
            scripts/e2e-capital-history.mjs \
            scripts/e2e-hirose-weekend.mjs \
            scripts/e2e-pnl-date-alignment.mjs \
            scripts/e2e-same-day-valuation.mjs \
            scripts/e2e-rate-edit-performance.mjs \
            scripts/e2e-publisher-risk.mjs \
            scripts/e2e-reference-rebuild.mjs \
            scripts/e2e-layout.mjs; do
            BROWSER=webkit node "$test"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Real Chromium DOM interaction test (deployed Pages)
        env:
          TEST_URL: ${{ steps.deployment.outputs.page_url }}
          BROWSER: chromium
        run: |
          for test in \
            scripts/e2e.mjs \
            scripts/e2e-hirose-pending.mjs \
            scripts/e2e-hirose-rates.mjs \
            scripts/e2e-live-rate-refresh.mjs \
            scripts/e2e-close-conversion.mjs \
            scripts/e2e-capital-history.mjs \
            scripts/e2e-hirose-weekend.mjs \
            scripts/e2e-pnl-date-alignment.mjs \
            scripts/e2e-same-day-valuation.mjs \
            scripts/e2e-rate-edit-performance.mjs \
            scripts/e2e-publisher-risk.mjs \
            scripts/e2e-reference-rebuild.mjs \
            scripts/e2e-layout.mjs; do
            node "$test"
          done

      - name: Real WebKit DOM interaction test (deployed Pages)
        env:
          TEST_URL: ${{ steps.deployment.outputs.page_url }}
          BROWSER: webkit
        run: |
          for test in \
            scripts/e2e.mjs \
            scripts/e2e-hirose-pending.mjs \
            scripts/e2e-hirose-rates.mjs \
            scripts/e2e-live-rate-refresh.mjs \
            scripts/e2e-close-conversion.mjs \
            scripts/e2e-capital-history.mjs \
            scripts/e2e-hirose-weekend.mjs \
            scripts/e2e-pnl-date-alignment.mjs \
            scripts/e2e-same-day-valuation.mjs \
            scripts/e2e-rate-edit-performance.mjs \
            scripts/e2e-publisher-risk.mjs \
            scripts/e2e-reference-rebuild.mjs \
            scripts/e2e-layout.mjs; do
            node "$test"
          done
